name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Get Buildozer Action
      uses: ArtemGovorov/buildozer-action@v1
      with:
        buildozer_version: stable
        command: buildozer android debug
        repository_root: .
